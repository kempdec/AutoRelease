name: Publicar

on:
  push:
    branches:
      - main
    paths:
      - "src/**"

  workflow_dispatch:
    inputs:
      version:
        description: "A versão da release, quando ela não deve ser calculada pelos commits (como 2.0.0)."
        required: false

permissions:
  contents: read

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    name: Testar, publicar o pacote e criar a release
    runs-on: ubuntu-latest
    permissions:
      # Criar a tag e a release.
      contents: write
      # Publicar o pacote no GitHub Packages.
      packages: write

    env:
      TOOL: src/AutoRelease/bin/Release/net10.0/KempDec.AutoRelease.dll
      AutoRelease_Token: ${{ secrets.GITHUB_TOKEN }}
      AutoRelease_Version: ${{ inputs.version }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compilar e testar
        run: |
          dotnet build --configuration Release
          dotnet test --no-build --configuration Release

      # A própria ferramenta, compilada deste commit, calcula a versão e cria a release do commit que disparou o
      # fluxo (GITHUB_SHA), e não da ponta do branch no momento em que roda.
      # A atribuição separada faz o passo falhar quando o cálculo falha: dentro do echo, o código de saída se perderia.
      - name: Calcular a versão
        id: version
        run: |
          version="$(dotnet "$TOOL" version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Gerar o pacote
        run: dotnet pack src/AutoRelease --configuration Release -p:Version=${{ steps.version.outputs.version }}

      # O pacote sai antes da release: se a release falhar, rodar de novo cria a mesma versão, e o --skip-duplicate
      # pula o pacote que já subiu. Na ordem contrária, uma falha no envio deixava uma release sem pacote.
      - name: Publicar o pacote no NuGet
        run: >-
          dotnet nuget push "published/*.nupkg" --api-key ${{ secrets.NUGET_TOKEN }}
          --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publicar o pacote no GitHub Packages
        run: >-
          dotnet nuget push "published/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }}
          --source https://nuget.pkg.github.com/kempdec/index.json --skip-duplicate

      - name: Criar a release
        run: dotnet "$TOOL" create --version ${{ steps.version.outputs.version }} --output-type HtmlUrl
